name: today_i_learned
description: A rich, interactive Flutter micro-knowledge exploration widget and showcase app for the Today I Learned (TIL) corpus.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - johnny-decimal/
    - termux-kali/
    - conduit-bending/
    - electrician/
    - ai-harnesses/
    - turbo-the-turtle/
